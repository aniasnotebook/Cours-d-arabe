<style>
  /* Flashcard app layout: pick a lesson, set the round, then one card at a time with answers under the thumb. */
  :root { --bg:#ffffff; --card:#fff; --surface:#fff; --ink:#1d1d1b; --muted:#6b665c; --line:#e2dccf; --faint:#b9b2a3;
          --accent:#1f3f8f; --on-accent:#fff; --ok:#2f7d4f; --ok-bg:#e3f1e7; --miss:#c2410c; --miss-bg:#fdebe1;
          --scrim:rgba(0,0,0,.55); --glyph:#1d1d1b; --q-name:#2fa84a; --pick:#1d1d1b; --on-pick:#fff;
          --p-ini:#1f3f8f; --p-med:#2fa84a; --p-fin:#e5603a; --p-iso:#1d1d1b; }   /* a letter's colour says its place in the word: start (blue pen), middle (apple green), end (blood orange), alone */
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#16181a; --surface:#22262a; --ink:#ece9e2; --muted:#a19d94; --line:#343a3f; --faint:#6d6a64;
          --accent:#8fa8f0; --on-accent:#0d1530; --ok:#6cc08d; --ok-bg:#1d3326; --miss:#f39a6b; --miss-bg:#3b261b; --pick:#ece9e2; --on-pick:#16181a; color-scheme:dark;
          --p-ini:#8fa8f0; --p-med:#5cc977; --p-fin:#f2875f; --p-iso:#ece9e2; } }
  :root[data-theme="dark"] { --bg:#16181a; --surface:#22262a; --ink:#ece9e2; --muted:#a19d94; --line:#343a3f; --faint:#6d6a64;
          --accent:#8fa8f0; --on-accent:#0d1530; --ok:#6cc08d; --ok-bg:#1d3326; --miss:#f39a6b; --miss-bg:#3b261b; --pick:#ece9e2; --on-pick:#16181a; color-scheme:dark; }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  html, body { height:100%; overscroll-behavior:none; touch-action:manipulation; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
         display:flex; flex-direction:column; align-items:center; overflow:hidden;
         padding-block:max(12px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-bottom, 0px));
         padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); }
  button { font:inherit; color:inherit; cursor:pointer; }
  p, small, .askbox b, h2, .ttl { text-wrap:pretty; }   /* no single word left alone on a last line */
  button:focus-visible, a:focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
  .app { width:100%; max-width:440px; height:100%; display:flex; flex-direction:column; }
  .screen { flex:1; min-height:0; display:flex; flex-direction:column; gap:14px; overflow:auto; }
  .screen > .ico { align-self:flex-start; }
  .toprow { display:flex; gap:8px; } .mid > .toprow + * { margin-top:auto; }
  /* Home and lesson screens sit in the middle of the screen; auto margins still let them scroll when tall. */
  .mid > :first-child:not(.ico):not(.toprow) { margin-top:auto; } .mid > .ico + * { margin-top:auto; } .mid > :last-child { margin-bottom:auto; }
  .ar { font-family:Amiri, "Noto Naskh Arabic", serif; font-weight:700; }

  /* Round icon buttons and the top bar */
  .ico { width:40px; height:40px; flex:0 0 auto; border-radius:50%; border:1px solid var(--line); background:var(--surface); display:grid; place-items:center; padding:0; color:var(--ink); }
  .ico svg { width:18px; height:18px; }
  .top { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; }
  .top .left, .top .right { display:flex; gap:8px; } .top .right { justify-content:flex-end; gap:6px; } .top .right .pillbtn { padding:0 10px; } .top h1 { padding:0 8px; white-space:nowrap; }
  .top h1 { margin:0; font-size:16px; font-weight:600; font-variant-numeric:tabular-nums; }
  .pillbtn { justify-self:end; height:40px; padding:0 14px; border-radius:999px; border:1px solid var(--line); background:var(--surface); font-size:14px; font-weight:600; }

  /* Lesson header: the Arabic title of the lesson, in the app's own look. */
  .bism { text-align:center; font-size:clamp(24px, 7vw, 28px); line-height:1.6; }
  .muted { color:var(--muted); margin:0; font-size:14px; }
  .center { text-align:center; }

  /* Home */
  .lesson { display:flex; flex-direction:column; gap:12px; padding:18px; border-radius:20px; background:var(--surface); border:1px solid var(--line); text-align:left; }
  .lesson .sample { font-size:42px; line-height:1.4; text-align:center; direction:rtl; }
  .lesson .row { display:flex; align-items:center; justify-content:space-between; }
  .lesson b { font-size:18px; display:block; }
  /* The home spreads its parts over the page; each card wears its lesson's number as a notebook tab, in blue pen. */
  #home > * { margin-top:0 !important; margin-bottom:0 !important; }
  #home { justify-content:space-evenly; padding-top:12px; padding-bottom:12px; }
  #home .bism { font-size:clamp(26px, 8.6vw, 34px); }
  #home .lesson { flex:none; position:relative; margin-top:36px !important; gap:10px; padding:16px 18px; border-top-right-radius:0; border-top-color:var(--accent); }
  #home .sample { font-size:clamp(40px, 13vw, 52px); }
  .ltab { position:absolute; top:-36px; right:-1px; height:36px; min-width:120px; padding:6px 18px 0; display:flex; align-items:center; justify-content:center;
          background:var(--accent); color:var(--on-accent); border-radius:14px 14px 0 0; font:700 18px/1 Amiri, serif; direction:rtl; }
  @media (max-height:640px) { #home { padding-top:34px; padding-bottom:4px; } #home .bism { font-size:24px; line-height:1.4; } #home .lesson { margin-top:32px !important; gap:4px; padding:10px 16px; }
    #home .sample { font-size:36px; line-height:1.25; } #home .ltab { top:-32px; height:32px; font-size:17px; } #home .ltitle { font-size:19px; line-height:1.35; } }
  .ltitle { display:block; width:100%; text-align:center; font:400 clamp(20px, 6.2vw, 24px)/1.5 Amiri, serif; color:var(--accent); direction:rtl; }
  .chev { font-size:26px; color:var(--accent); }

  /* Lesson screens */
  .lessonbox { display:flex; flex-direction:column; gap:6px; margin-top:6px; padding-top:14px; border-top:1px solid var(--line); }
  .lessonbox .lrow { display:flex; flex-wrap:wrap; justify-content:flex-end; align-items:center; gap:8px; min-height:46px; }
  .lessonbox .lrow > span { display:flex; align-items:center; gap:8px; flex:1; font-weight:600; font-size:15px; }
  .lessonbox .lrow svg { width:18px; height:18px; }
  .lessonbox .lbtn { display:grid; place-items:center; min-width:48px; height:42px; padding:0 10px; border-radius:12px; border:1px solid var(--line); background:var(--surface); color:var(--ink); font:700 15px/1 system-ui, sans-serif; text-decoration:none; white-space:nowrap; }
  .randset label { padding:10px 16px; }
  .label { font-size:13px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:var(--muted); }
  .settings { display:flex; flex-direction:column; border-radius:16px; border:1px solid var(--line); background:var(--surface); }
  .settings label { display:flex; align-items:center; gap:12px; padding:14px 16px; cursor:pointer; }
  .settings label + label { border-top:1px solid var(--line); }
  .settings b { display:block; font-size:15px; }
  .settings small { display:block; font-size:13px; color:var(--muted); }
  .settings input { width:22px; height:22px; flex:0 0 auto; accent-color:var(--accent); margin-left:auto; }
  .go { display:flex; align-items:center; justify-content:center; gap:10px; min-height:60px; padding:10px 16px; border-radius:16px; border:0; background:var(--accent); color:var(--on-accent); font-size:18px; font-weight:700; text-align:left; }
  .go .tile { width:48px; height:48px; border-radius:10px; background:#fff; color:#1d1d1b; display:grid; place-items:center; font-size:28px; flex:0 0 auto; }
  .go span.t { flex:1; } .go small { display:block; font-size:13px; font-weight:400; opacity:.9; }

  /* Play */
  .bar { height:6px; border-radius:3px; background:var(--line); overflow:hidden; }
  .bar i { display:block; height:100%; width:0; background:var(--accent); transition:width .25s; }
  .tally { display:flex; justify-content:space-between; align-items:center; font-size:14px; font-weight:600; font-variant-numeric:tabular-nums; }
  .pill { padding:3px 10px; border-radius:999px; }
  .pill.m { color:var(--miss); background:var(--miss-bg); } .pill.k { color:var(--ok); background:var(--ok-bg); }
  .tally .pillbtn { height:auto; padding:4px 12px; }
  .tally > * { white-space:nowrap; }
  @media (max-width:360px) { .tally { font-size:12.5px; gap:4px; } .pill { padding:3px 7px; } .tally .pillbtn { padding:4px 9px; } }   /* small phones: each pill stays on one line */
  .stage { flex:1; min-height:200px; position:relative; }
  .card { position:absolute; inset:0; background:var(--card); border-radius:24px; box-shadow:0 2px 6px rgba(0,0,0,.08);
          display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; color:#1d1d1b;
          user-select:none; -webkit-user-select:none; border:3px solid transparent; overflow:hidden; }
  .card.swipe { touch-action:none; cursor:grab; }
  .card.under { transform:scale(.95) translateY(10px); }
  .enter { animation:enter .25s ease; }
  @keyframes enter { from { transform:scale(.95) translateY(10px); opacity:.6; } to { transform:none; opacity:1; } }
  .card.anim { transition:transform .22s ease .06s, opacity .22s ease .06s; }
  .card.good { border-color:#2f7d4f; } .card.bad { border-color:#c2410c; }
  .glyph { font-size:min(150px, 34vw, 18vh); line-height:1.25; position:relative; }
  .card.has-fams { padding:12px 12px 14px; }
  .card.has-fams .glyph { margin-top:auto; font-size:min(130px, 30vw, 14vh); padding-top:28px; }   /* clear of the red name */
  @media (max-height:700px) { .card.has-fams .fams .note { font-size:11px; } .card.has-fams .fams { gap:6px; } .card.has-fams .glyph { font-size:12vh; padding-top:22px; } }
  .card.has-fams .fams { position:static; margin-top:auto; }
  .arname { position:absolute; top:12px; left:0; right:0; text-align:center; color:var(--q-name); font-size:32px; line-height:1.4; pointer-events:none; }
  .verdict { font-size:15px; font-weight:800; } .verdict.good { color:#2f7d4f; } .verdict.bad { color:#c2410c; }
  .hint { margin:0; text-align:center; font-size:13px; color:var(--muted); }

  /* Family labels sit on the card: black when chosen, green or orange once the card is turned. */
  .fams { position:absolute; left:12px; right:12px; bottom:14px; display:flex; flex-direction:column; align-items:center; gap:8px; }
  .fams .q { font-size:13px; font-weight:600; color:#6b665c; }
  .fams .chips { display:flex; flex-wrap:wrap; justify-content:center; gap:8px; }
  .chip { display:flex; align-items:center; gap:6px; height:40px; padding:0 14px; border-radius:999px; border:1px dashed #b9b2a3; background:#fff; color:#6b665c; font-size:14px; font-weight:600; }
  .chip svg { width:16px; height:16px; }
  .chip.on { border:2px solid #1d1d1b; background:#1d1d1b; color:#fff; font-weight:700; }
  .chip.right { border:2px solid #2f7d4f; background:#e3f1e7; color:#2f7d4f; font-weight:700; }
  .chip.wrong { border:2px solid #c2410c; background:#fdebe1; color:#c2410c; font-weight:700; }
  .chip.off { border:1px solid #e2dccf; color:#b9b2a3; }
  .fams .tapcheck { display:inline-flex; align-items:center; gap:6px; padding:4px 12px; border-radius:99px; background:#f3efe6; color:#1d1d1b; font:600 13px system-ui, sans-serif; }
  .fams .tapcheck svg { width:14px; height:14px; }
  .fams .note { font-size:12px; color:#6b665c; }
  .fams .res { font-size:13px; font-weight:700; } .fams .res.good { color:#2f7d4f; } .fams .res.bad { color:#c2410c; }

  /* The book draws the long ya with two dots below; no Unicode letter has them, so they are drawn. */
  .yb { position:relative; display:inline-block; }
  .yb::before, .yb::after { content:""; position:absolute; width:.1em; height:.1em; background:currentColor; transform:rotate(45deg); bottom:.06em; }
  .yb::before { left:.36em; } .yb::after { left:.52em; }

  .actions { display:grid; grid-template-columns:1fr auto 1fr; gap:14px; align-items:center; }
  .act { display:flex; flex-direction:column; align-items:center; gap:4px; border:0; background:none; font-size:13px; font-weight:600; }
  .act span { width:64px; height:64px; border-radius:50%; display:grid; place-items:center; border:2px solid; }
  .act svg { width:28px; height:28px; }
  .act.m { color:var(--miss); } .act.m span { background:var(--miss-bg); }
  .act.k { color:var(--ok); } .act.k span { background:var(--ok-bg); }
  .act.u { color:var(--muted); } .act.u span { width:48px; height:48px; border-color:var(--line); background:var(--surface); }
  .act.u svg { width:22px; height:22px; }
  .act:disabled { opacity:.35; cursor:default; }

  /* Lesson 2 choices: everything is on the card (as the family chips), below it only the action buttons. */
  .card.quiz { justify-content:flex-start; padding:12px 10px 12px; gap:8px; }

  .spk { width:44px; height:38px; border-radius:99px; border:1px solid var(--line); background:#fff; color:#1d1d1b; display:grid; place-items:center; padding:0; }
  .spk svg { width:20px; height:20px; } .spk.on { background:var(--accent); border-color:var(--accent); color:#fff; }
  .card.under .tops { visibility:hidden; }
  #ytBox { position:fixed; left:-10000px; top:0; width:240px; aspect-ratio:16/9; border-radius:12px; overflow:hidden; background:#000; z-index:5; }
  /* While a sound plays, the video rises from the bottom of the screen in a sheet, like the Prononciation one: 16:9, no black
     bars, at least 200 px high (YouTube's minimum player size); the card above stays free to trace. */
  #ytSheet { position:fixed; left:0; right:0; bottom:0; z-index:4; background:var(--surface); border-radius:20px 20px 0 0; box-shadow:0 -6px 24px rgba(0,0,0,.18);
    padding-bottom:env(safe-area-inset-bottom); transform:translateY(calc(100% + 40px)); transition:transform .22s ease; }

  #ytBox iframe { width:100%; height:100%; display:block; border:0; }
  .pron { display:inline-flex; align-items:center; gap:6px; height:38px; padding:0 12px; border-radius:99px; border:1px solid var(--line); background:#fff; color:#1d1d1b; font:600 13px system-ui, sans-serif; z-index:1; }
  .pron svg { width:18px; height:18px; }
  .sheetwrap { align-items:flex-end; padding:0; }
  .psheet { width:100%; max-width:520px; max-height:88%; display:flex; flex-direction:column; background:var(--bg); border-radius:22px 22px 0 0; padding:12px 14px max(14px, env(safe-area-inset-bottom, 0px)); }
  .phead { display:flex; align-items:center; justify-content:space-between; padding-bottom:8px; }
  .phead .ar { font-size:40px; line-height:1; width:56px; height:56px; display:grid; place-items:center; padding-bottom:8px; box-sizing:border-box; background:var(--surface); border:1px solid var(--line); border-radius:14px; }
  .phead .ico { width:44px; height:44px; }
  .pbody { overflow:auto; display:flex; flex-direction:column; gap:10px; }
  .pbody img { width:100%; display:block; border-radius:10px; }
  .sheetpg { width:100%; display:block; border-radius:6px; }
  .paper { width:100%; max-width:520px; max-height:100%; overflow:auto; background:#fff; color:#1d1d1b; border-radius:12px; padding:14px; display:flex; flex-direction:column; gap:10px; }
  .paper .grid { gap:0; border:1px solid #333; }
  .paper .mini { border:1px solid #333; border-radius:0; }
  .paper h3 { margin:6px 0 0; font-size:14px; text-align:center; }
  .table { width:100%; border-collapse:collapse; direction:rtl; font-size:24px; text-align:center; }

  .table td { border:1px solid #333; line-height:1.6; }
  .table td.n { color:var(--q-name); font-size:18px; }
  .words { direction:rtl; border:1px solid #333; } .words > div { display:grid; }
  .words > div > span { border:1px solid #333; text-align:center; font-size:28px; line-height:1.7; }
  img.cal { height:1.25em; vertical-align:middle; } .mini img.cal { height:1.6em; } .wcard .prompt img.cal { height:1.4em; }
  .wcard .model.guide img.cal { opacity:.25; }
  .words img { display:block; width:100%; height:auto; }
  .bookpage { margin-bottom:14px; } .bookpage .pn { display:block; font:600 12px/1.6 system-ui, sans-serif; color:#6b665c; text-align:center; }
  @media (prefers-reduced-motion: reduce) { .card.anim, .bar i { transition:none; } .enter { animation:none; } }
  /* The logo: three cards. In the top-right corner (Arabic reads from the right), hidden during a round. */
  .app { position:relative; }
  .corner { position:absolute; top:0; right:0; width:40px; height:40px; pointer-events:none; z-index:2; }
  .mark > g { transform-box:view-box; transform-origin:55px 104px; }
  /* Loader: the cards fan open and closed while the Arabic font downloads (first visit only). */
  #loader { position:fixed; inset:0; background:var(--bg); display:grid; place-items:center; z-index:50; }
  #loader .r { animation:fanR 1.4s ease-in-out infinite; } #loader .g { animation:fanG 1.4s ease-in-out infinite; }
  @keyframes fanR { 0%,100% { transform:rotate(0); } 50% { transform:rotate(-14deg); } }
  @keyframes fanG { 0%,100% { transform:rotate(0); } 50% { transform:rotate(-6deg); } }
  /* Pull down to reload: the logo comes down with the finger, then fans while the page reloads. */
  #ptr { position:fixed; left:50%; top:0; width:44px; height:44px; margin-left:-22px; z-index:40; pointer-events:none; opacity:0; transform:translateY(-50px); }
  #ptr.back { transition:transform .2s, opacity .2s; }
  #ptr.spin .r { animation:fanR 1.4s ease-in-out infinite; } #ptr.spin .g { animation:fanG 1.4s ease-in-out infinite; }
  /* The results: the logo moves its own way for each score band. */
  .party { position:relative; width:84px; height:84px; margin:0 auto; }
  .party .mark { position:relative; z-index:1; transform-origin:50% 100%; }
  .party i { position:absolute; left:50%; top:50%; width:8px; height:12px; border-radius:2px; opacity:0; animation:boom 2.4s ease-out var(--d) var(--n,1) both; }
  /* 100 %, "Bravo, tu as tout réussi": a big jump, the three cards spread wide, two bursts of confetti. */
  .m5 .mark { animation:jumpBig 2.4s cubic-bezier(.3,.6,.4,1) var(--n,1); }
  .m5 .r { animation:spreadR 2.4s ease-out var(--n,1); } .m5 .f { animation:spreadF 2.4s ease-out var(--n,1); }
  /* 80 to 99 %, "Tu y es presque": a jump, the red card tilts, one burst of confetti. */
  .m4 .mark { animation:jump 2.4s cubic-bezier(.3,.6,.4,1) var(--n,1); }
  .m4 .r { animation:tilt 2.4s ease-out var(--n,1); }
  /* 50 to 79 %, "Persévère": a small hop and the cards fan open once, no confetti. */
  .m3 .mark { animation:hop 2.4s ease-out var(--n,1); }
  .m3 .r { animation:fanR1 2.4s ease-in-out var(--n,1); } .m3 .g { animation:fanG1 2.4s ease-in-out var(--n,1); }
  /* Under 50 %, "Tu peux mieux faire": the cards nod gently, twice. */
  .m2 .mark { animation:nod 2.4s ease-in-out var(--n,1); }
  @keyframes jump { 0% { transform:translateY(0) scale(1.08,.9); } 12% { transform:translateY(-30px) scale(.96,1.05); } 25% { transform:translateY(0) scale(1.1,.88); } 32%,100% { transform:none; } }
  @keyframes jumpBig { 0% { transform:translateY(0) scale(1.1,.88); } 14% { transform:translateY(-40px) scale(.94,1.07) rotate(-6deg); } 28% { transform:translateY(0) scale(1.12,.86); } 36% { transform:translateY(-10px); } 44%,100% { transform:none; } }
  @keyframes tilt { 0%,5% { transform:rotate(0); } 15% { transform:rotate(-14deg); } 30%,100% { transform:rotate(0); } }
  @keyframes spreadR { 0%,5% { transform:rotate(0); } 18%,40% { transform:rotate(-24deg); } 55%,100% { transform:rotate(0); } }
  @keyframes spreadF { 0%,5% { transform:rotate(0); } 18%,40% { transform:rotate(14deg); } 55%,100% { transform:rotate(0); } }
  @keyframes hop { 0%,100% { transform:none; } 12% { transform:translateY(-10px); } 24%,100% { transform:none; } }
  @keyframes fanR1 { 0%,8% { transform:rotate(0); } 25%,38% { transform:rotate(-16deg); } 55%,100% { transform:rotate(0); } }
  @keyframes fanG1 { 0%,8% { transform:rotate(0); } 25%,38% { transform:rotate(-7deg); } 55%,100% { transform:rotate(0); } }
  @keyframes nod { 0%,100% { transform:rotate(0); } 12% { transform:rotate(-6deg); } 24% { transform:rotate(3deg); } 36% { transform:rotate(-4deg); } 48%,100% { transform:rotate(0); } }
  @keyframes boom { 0% { opacity:0; transform:rotate(var(--a)) translateY(0); } 8% { opacity:1; } 40% { opacity:1; transform:rotate(var(--a)) translateY(-80px) rotate(200deg); } 60%,100% { opacity:0; transform:rotate(var(--a)) translateY(-90px) rotate(260deg); } }
  @media (prefers-reduced-motion: reduce) { .party .mark, .party g { animation:none !important; } .party i { display:none; } }

const NOJOIN = "اأإآٱدذرزوؤةىء";   // never joined to the letter after them (ء to neither side)

  return fromPrev && toNext ? "med" : fromPrev ? "fin" : toNext ? "ini" : "iso";

// ---------- Helpers
// A number stays on the line of the word next to it (« page 7 », « 54 cases »): the spaces around it do not break.
const nb = t => t.replace(/ (?=\d)|(?<=\d) /g, "\u00a0");

// Séparer les lettres: the chips are always the 30 letters of lesson 1, as learned there, so the learner links the new
// way of writing to a letter they know. A hamza on alif, waw or ya is the hamza (ء); the Persian kaf is kaf; ta marbuta
// is read ta (ت). A ya is one chip "ى / ے" (either ya of lesson 1), except in the one cell with both ya (يى), where the
// dotted one is ے and the round one is ى.
const YA = "Y", YA_LABEL = `<span class="ya2">ى<i>/</i><span class="yb">ے</span></span>`;   // one unit: the two ya with a thin slash
const L1 = (c, w = "") => /ي/.test(w) && /ى/.test(w) ? ({ "ي": "ے", "ى": "ى" })[c] || L1(c)
  : ({ "ک": "ك", "أ": "ء", "إ": "ء", "ؤ": "ء", "ئ": "ء", "ة": "ت", "ي": YA, "ى": YA })[c] || c;
const l1Show = (c, w) => chipLabel(L1(c, w));
const HAMZA = `<span style="font-size:1.5em; line-height:0.6">ء</span>`;   // the lone hamza is drawn small: enlarged to read
const chipLabel = c => c === YA ? YA_LABEL : c === "ء" ? HAMZA : glyph(c);
const L1_LETTERS = GLYPHS.filter(c => c !== "ى" && c !== "ے").concat(YA);
const L1_LOOKALIKE = [["ب","ت","ث","ن",YA],["ج","ح","خ"],["د","ذ"],["ر","ز"],["س","ش"],["ص","ض"],["ط","ظ"],["ع","غ","ء"],["ف","ق"],["ك","ل"],["م","ه","و","ا"]];
function lessonChoices(tokens, n) {
  const want = new Set(tokens);
  const pool = want.has("ے") ? L1_LETTERS.filter(c => c !== YA) : L1_LETTERS;
  const near = shuffle(L1_LOOKALIKE.filter(g => g.some(c => want.has(c))).flat().filter(c => !want.has(c) && pool.includes(c)));
  const rest = shuffle(pool.filter(c => !want.has(c) && !near.includes(c)));
  const k = Math.max(0, n - want.size), nearCount = Math.min(near.length, Math.ceil(k / 2));

}
function choicesFor(letters, n) {
  const want = new Set(letters);
  const near = shuffle(LOOKALIKE.filter(grp => grp.some(c => want.has(c))).flat().filter(c => !want.has(c)));
  const rest = shuffle(FORM_LETTERS.filter(c => !want.has(c) && !near.includes(c)));
  // A couple of look-alikes keep it hard; the rest is drawn at random so each round shows a new set.
  const k = n - want.size, nearCount = Math.min(near.length, Math.ceil(k / 2));
  return shuffle([...want, ...near.slice(0, nearCount), ...rest.slice(0, k - nearCount)]);
}

  wheelTimer = setTimeout(() => wheelSum = 0, 200);
  if (Math.abs(wheelSum) > 120) { answer(wheelSum > 0); wheelSum = 0; wheelLock = true; setTimeout(() => wheelLock = false, 700); }
}, { passive: false });

// ---------- Lesson 2: choose, check, next
function renderQuiz() {
  const it = deck[pos], chip = (k, v, label, ar) => `<button class="chip${ar ? " ar" : ""}" data-k="${k}" data-v="${v}"${ar ? ' lang="ar"' : ""}>${ar ? "" : ICONS.plus}${label}</button>`;

// The same row as in every exercise: skip or to review on the left, back in the middle, go on the right.
function qButtons() {
  $("qActions").innerHTML = checked
    ? `<button class="act n" disabled><span>${ICONS.skip}</span>Passer</button><button class="act u" id="qBack" ${answers.length > 1 ? "" : "disabled"}><span>${ICONS.undo}</span>Retour</button>
       <button class="act go2" id="check"><span>${ICONS.next}</span>${answers.length >= deck.length ? "Terminer" : "Suivante"}</button>`
    : `<button class="act n" id="qSkip"><span>${ICONS.skip}</span>Passer</button>
       <button class="act u" id="qBack" ${answers.length ? "" : "disabled"}><span>${ICONS.undo}</span>Retour</button>
       <button class="act go2" id="check" disabled><span>${ICONS.verify}</span>Vérifier</button>`;
  settle($("qActions"));
  // Retour always goes to the previous card, even once this one is checked.
  $("qBack").onclick = () => { clearTimeout(quizAuto); if (checked) answers.pop(); undo(); };
  if (checked) return;
  $("check").onclick = check;
  // Skipping is its own count (not to review, not in the score); the next card simply takes its place.
  $("qSkip").onclick = () => { if (checked) return; checked = true; answers.push({ item: deck[pos], ok: false, skip: true }); render(); };   // no swipe: the next card simply takes its place
}

function choose(b) {
  if (checked) return;
  const k = b.dataset.k, v = b.dataset.v;
  if (k === "fam") {   // several families, or « aucune » alone
    if (v === "none") pick.fam = pick.fam.has("none") ? new Set() : new Set(["none"]); else { pick.fam.delete("none"); pick.fam.has(v) ? pick.fam.delete(v) : pick.fam.add(v); }
    $("card").querySelectorAll('.chip[data-k="fam"]').forEach(o => { const on = pick.fam.has(o.dataset.v); o.classList.toggle("on", on);
      o.innerHTML = (on ? ICONS.check : ICONS.plus) + (o.dataset.v === "none" ? "Aucune des trois" : FAM[o.dataset.v]); });
  } else if (k === "multi" || k === "pos") { pick[k].has(v) ? pick[k].delete(v) : pick[k].add(v); b.classList.toggle("on");
    if (k === "pos") b.innerHTML = (b.classList.contains("on") ? ICONS.check : ICONS.plus) + POS[v]; }
  else { pick[k] = v; $("card").querySelectorAll(`.chip[data-k="${k}"]`).forEach(o => { o.classList.toggle("on", o === b);
    if (mode === "signs") o.innerHTML = (o === b ? ICONS.check : ICONS.plus) + o.textContent; }); }
  $("check").disabled = mode === "fams" ? !pick.fam.size : mode === "signs" ? !(pick.name && pick.say) : mode === "forms" ? !(pick.letter && pick.pos.size) : !pick.multi.size;
}

function check() {
  checked = true;
  const it = deck[pos], card = $("card");
  let ok;
  const ans = card.querySelector(".ans"), chips = card.querySelectorAll(".chip");
  chips.forEach(o => o.disabled = true);
  if (mode === "fams") {
    const want = it.fams.length ? it.fams : ["none"];
    ok = pick.fam.size === want.length && want.every(f => pick.fam.has(f));
    chips.forEach(o => {
      const right = want.includes(o.dataset.v), chosen = pick.fam.has(o.dataset.v), label = o.dataset.v === "none" ? "Aucune des trois" : FAM[o.dataset.v];
      o.className = "chip" + (right && chosen ? " right" : right ? " missed" : chosen ? " wrong" : " off");
      o.innerHTML = (right && chosen ? ICONS.check : "") + label;
    });
    card.querySelector(".note").remove();
    const what = it.fams.length ? "lettre " + it.fams.map(f => FAM_OF[f]).join(" et ") : "aucune des trois familles";
    ans.insertAdjacentHTML("beforeend", `<span class="famres ${ok ? "good" : "bad"}">${what[0].toUpperCase() + what.slice(1)}</span>`);
    card.insertAdjacentHTML("afterbegin", `<span class="verdict ${ok ? "good" : "bad"}">${ok ? "Juste" : "À revoir"}</span>`);
  } else if (mode === "signs") {
    const sayOf = id => SIGNS.find(x => x.id === id).say;
    ok = pick.name === it.id && sayOf(pick.say) === it.say;
    // The book's ways sit beside the sheet's explanation, in one row: a bigger strip of pictures, the table next to it.
    ans.insertAdjacentHTML("beforeend", `<span class="sigline"><span class="sigrow"><span class="k">Nom</span><span>${it.ar ? `<span class="ar" lang="ar">${it.ar}</span> <span class="nw">· <b>${it.fr}</b></span>` : `<b>${it.fr}</b>`}</span>
      <span class="k">Exemple</span><span class="ar ex" lang="ar">${it.id === "dammatan" ? `<img class="eximg" src="book/sg/ex-dammatan.png" alt="${it.ex}">` : it.ex}</span><span class="k">Lecture</span><span>${tail(it.read)}</span>${it.note ? `<span class="snote">${tail(it.note)}</span>` : ""}</span></span>`);
    chips.forEach(o => {
      const right = o.dataset.v === it.id, chosen = o.classList.contains("on"), label = o.textContent;
      o.className = "chip" + (right && chosen ? " right" : right ? " missed" : chosen ? " wrong" : " off");
      o.innerHTML = (right && chosen ? ICONS.check : "") + label;
    });
    card.insertAdjacentHTML("afterbegin", `<span class="verdict ${ok ? "good" : "bad"}">${ok ? "Juste" : "À revoir"}</span>`);
  } else if (mode === "forms") {
    const places = samePlaces(it.g, it.p);
    ok = pick.letter === it.g && pick.pos.size === places.length && places.every(q => pick.pos.has(q));
    ans.insertAdjacentHTML("beforeend", `<span class="formrow ar" lang="ar">${positions(it.g).map(q => `<span class="${q === it.p ? "on" : ""}"><small>${q === it.p ? places.map(x => POS[x]).join(" / ") : POS[q]}</small>${formOf(it.g, q)}</span>`).join("")}</span>`);
    // The class's word for these 6: they join the letter before, never the one after (Fiche 1).
    if (NOLINK.includes(it.g)) { card.classList.add("tight"); ans.insertAdjacentHTML("beforeend", `<span class="nolink"><span class="l">Lettre non liante : elle s’attache à la lettre d’avant, mais jamais à celle qui la suit.</span><span class="s">Non liante : jamais attachée à la lettre qui suit.</span></span>`); }
    chips.forEach(o => {
      const right = o.dataset.k === "letter" ? o.dataset.v === it.g : places.includes(o.dataset.v), chosen = o.classList.contains("on");
      o.className = "chip" + (o.dataset.k === "letter" ? " ar" : "") + (right && chosen ? " right" : right && o.dataset.k === "pos" ? " missed" : right ? " right" : chosen ? " wrong" : " off");
      if (o.dataset.k === "pos") o.innerHTML = (right && chosen ? ICONS.check : "") + POS[o.dataset.v]
        + (right && !chosen ? `<span class="tag">oubliée</span>` : !right && chosen ? `<span class="tag">en trop</span>` : "");
    });
    card.querySelector(".chips:not(.letters)").classList.add("tagged");
    card.insertAdjacentHTML("afterbegin", `<span class="verdict ${ok ? "good" : "bad"}">${ok ? "Juste" : "À revoir"}</span>`);
  } else {
    const want = new Set(lettersOf(it.w).map(c => L1(c, it.w)));
    const missed = [...want].filter(c => !pick.multi.has(c)), extra = [...pick.multi].filter(c => !want.has(c));
    ok = !missed.length && !extra.length;
    const verdict = ok ? "Juste" : `À revoir : ${[missed.length && `${missed.length} oubliée${missed.length > 1 ? "s" : ""}`, extra.length && `${extra.length} en trop`].filter(Boolean).join(", ")}`;
    ans.querySelector(".big").innerHTML = wordInk(it);
    ans.insertAdjacentHTML("beforeend", `<span class="parts ar" lang="ar">${[...it.w].map((c, i) => c === "ـ" ? "" : `<span style="color:${inkOf(it.w, i, it.k)}">${l1Show(c, it.w)}</span>`).join("")}</span>`);
    chips.forEach(o => {
      const v = o.dataset.v, inWord = want.has(v), chosen = pick.multi.has(v);
      o.className = "chip ar" + (inWord && chosen ? " right" : inWord ? " missed" : chosen ? " wrong" : " off");
      if (inWord && !chosen) o.innerHTML += `<span class="tag">oubliée</span>`;
      if (!inWord && chosen) o.innerHTML += `<span class="tag">en trop</span>`;
    });
    card.querySelector(".chips").classList.add("tagged");
    card.querySelector(".note").remove();
    card.insertAdjacentHTML("afterbegin", `<span class="verdict ${ok ? "good" : "bad"}">${!ok && (!pick.multi.size || missed.length === want.size) ? "À revoir" : verdict}</span>`);
  }
  card.classList.add(ok ? "good" : "bad"); tint(card, ok ? 100 : -100);
  answers.push({ item: it, ok });
  const good = answers.filter(a => a.ok).length, bad = answers.filter(a => !a.ok && !a.skip).length;
  $("nGood").textContent = `${good} juste${good > 1 ? "s" : ""}`;
  $("nBad").textContent = `${bad} à revoir`;
  $("barFill").style.width = `${answers.length / deck.length * 100}%`;
  qButtons();
  const btn = $("check");
  // The next card comes by itself after time to read the correction; a finger resting on the card holds it until lifted.
  let held = false, due = false;
  const next = () => { clearTimeout(quizAuto); if ($("play").hidden || pos !== answers.length - 1) return;
    if (!$("page").hidden) { quizAuto = setTimeout(next, 1000); return; }   // the book page is open: wait
    btn.onclick = null; fly($("card"), ok, render); };
  btn.onclick = next;
  card.onpointerdown = () => { held = true; };
  card.onpointerup = card.onpointercancel = card.onpointerleave = () => { if (!held) return; held = false; if (due) next(); };
  quizAuto = setTimeout(() => held ? due = true : next(), 4000);
}

    if (pull > 0) place(); else { pull = 0; place(); }
  }, { passive: true });
  document.addEventListener("touchend", () => {
    if (y0 === null) return;
    y0 = null;
    if (pull > PULL) { ptr.style.transform = "translateY(24px)"; ptr.style.opacity = 1; ptr.classList.add("spin"); setTimeout(reloadHere, 150); }
    else { pull = 0; ptr.classList.add("back"); place(); }
  });
}
// A reload comes back to the same place: the same screen, and in a round the same cards and answers so far.
const pool = m => m === "letters" || m === "fams" || m === "wletters" ? LETTERS : m === "forms" || m === "wforms" ? FORMS : m === "signs" || m === "wsigns" ? SIGNS : WORD_CARDS;
// Where the user is, kept for a reload: the app's own, or the browser's (pull to refresh).
function savePlace() {
  const screen = ["home","l1","l2","c1","cw","play","write","stats"].find(id => !$(id).hidden);
  if (screen) try {
    const P = pool(mode), ix = a => a.map(x => P.indexOf(x));
    sessionStorage.setItem("place", JSON.stringify({ screen, mode, famQuiz, wKind, back: $("pkA").dataset.w === "choose" ? choiceOf : $("cwBack").dataset.back,
      round: writing() ? { src: ix(wSource), deck: ix(wDeck), ans: wAnswers.map(a => [P.indexOf(a.item), a.ok, a.skip]), pos: wPos }
        : { src: ix(source), deck: ix(deck), ans: answers.map(a => [P.indexOf(a.item), a.ok, a.famOk, a.skip]) } }));
  } catch {}
}
function reloadHere() { savePlace(); location.reload(); }
addEventListener("pagehide", savePlace);
// Back without a reload (the app left open in the background): the saved place is old, drop it so a later restart cannot
// bring back a round already played.
const dropPlace = () => { try { sessionStorage.removeItem("place"); } catch {} };
addEventListener("pageshow", dropPlace);
document.addEventListener("visibilitychange", () => { if (!document.hidden) dropPlace(); });
function backToPlace() {
  let p; try { p = JSON.parse(sessionStorage.getItem("place")); sessionStorage.removeItem("place"); } catch {}
  if (!p) return false;
  mode = p.mode; famQuiz = p.famQuiz; wKind = p.wKind;
  if (p.screen === "cw") { p.back === "words" || p.back === "forms" || p.back === "signs" ? openChoice(p.back) : openWriting(p.back === "l2" ? 2 : 1); return true; }
  if (!["play", "write", "stats"].includes(p.screen)) { show(p.screen); return true; }
  const P = pool(mode), r = p.round, at = i => P[i];
  if (writing()) {
    wKind === "split" || wKind === "form" || wKind === "sign" ? openChoice({ split: "words", form: "forms", sign: "signs" }[wKind]) : openWriting(mode === "wwords" ? 2 : 1); mode = p.mode; wKind = p.wKind;
    wSource = r.src.map(at); wDeck = r.deck.map(at); wAnswers = r.ans.map(([i, ok, skip]) => ({ item: at(i), ok, skip })); wPos = r.pos;
    if (wKind === "trace" && autoOn()) wAskSound = true;   // a phone plays sound only after a tap: the answer is that tap
    if (p.screen === "stats") showStats(); else openWriteRound();
  } else {
    if (mode === "words" || mode === "forms" || mode === "signs") openChoice(mode);   // so Retour from the round finds the choice screen
    source = r.src.map(at); deck = r.deck.map(at); answers = r.ans.map(([i, ok, famOk, skip]) => ({ item: at(i), ok, famOk, skip }));
    if (p.screen === "stats") showStats(); else openRound();

}
// The loader only shows if the Arabic font is still downloading after a moment (in practice, the first visit).
{ let ready = false;
  const done = () => { ready = true; $("loader").hidden = true; };
  setTimeout(() => { if (!ready) { $("loader").innerHTML = `<div style="width:96px;height:96px">${MARK}</div>`; $("loader").hidden = false; } }, 250);
  Promise.race([document.fonts.ready, new Promise(r => setTimeout(r, 4000))]).then(done); }
// Updates on their own: each time the installed app comes back to the screen it asks for a new version, and loads it
// as soon as no round is under way (an installed app has no reload button).
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").then(reg =>
    document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") reg.update().catch(() => {}); })
  ).catch(() => {});
  let fresh = !navigator.serviceWorker.controller;   // the very first visit installs it: nothing to reload
  const inRound = () => !$("play").hidden || !$("write").hidden || !$("gate").hidden || !$("page").hidden;
  const reloadWhenFree = () => { if (!inRound()) reloadHere(); else setTimeout(reloadWhenFree, 2000); };
  navigator.serviceWorker.addEventListener("controllerchange", () => { if (!fresh) { fresh = true; reloadWhenFree(); } });
}

// ---------- Wiring
// Leaving a round that has started asks first: one stray tap must not lose a long round.
const roundStarted = () => !$("play").hidden ? answers.length > 0
  : !$("write").hidden && (wKind === "trace" ? wPos > 0 || wStrokes.length > 0 : wAnswers.length > 0);
const ASK = { quit: ["Quitter le tour ?", "Ce que tu as fait dans ce tour ne sera pas gardé.", "Quitter"],
  restart: ["Recommencer le tour ?", "Le tour reprend depuis la première carte.", "Recommencer"],
  stop: ["Terminer le tour ?", "Tu verras tes résultats.", "Terminer"] };
// The 127 cells of lesson 2 are long for one round: at the end of each book page (7, then 8), a pause asks whether to go
// on or see the results. Random order mixes the cards page by page, so each pause ends a real page.
const fullBook = src => src.length === WORD_CARDS.length && WORD_CARDS.includes(src[0]);
function deckOf(src, random, from = 7) {
  if (!fullBook(src)) return random ? shuffle(src) : src.slice();
  return [7, 8, 9].filter(pg => pg >= from).flatMap(pg => { const cs = src.filter(c => bookPage(c) === pg); return random ? shuffle(cs) : cs; });
}
let pausedAt = -1;
function pageBreak(done, d, src, finish) {
  if (!fullBook(src) || !done || done >= d.length || pausedAt === done) return false;
  const page = bookPage(d[done - 1]), next = bookPage(d[done]);
  if (page === next) return false;
  pausedAt = done;
  $("askT").textContent = nb(`Partie ${page - 6} terminée`);
  $("askP").textContent = nb(`Continuer avec la partie ${next - 6}, ou voir tes résultats\u00a0?`);
  $("askNo").textContent = "Continuer"; $("askYes").textContent = "Résultats";
  $("ask").hidden = false;
  $("askNo").onclick = () => { $("ask").hidden = true; wCardT0 = Date.now(); if (writing()) autoSound(); };   // the tap on « Continuer » starts this card's sound
  $("askYes").onclick = () => { $("ask").hidden = true; keepStop(src, next); finish(); };
  return true;
}
// A round stopped at a pause is remembered for its exercise: the next round of the whole lesson asks whether to go on
// from the next page or start again from page 7.
const stopKey = () => "stop:" + mode + (writing() ? ":" + wKind : "");
const keepStop = (src, pg) => { try { localStorage.setItem(stopKey(), pg); } catch {} };
const forgetStop = src => { if (fullBook(src)) try { localStorage.removeItem(stopKey()); } catch {} };
function fromPage(src, go) {
  let pg = 0; try { pg = fullBook(src) ? +localStorage.getItem(stopKey()) || 0 : 0; } catch {}
  if (!pg) return go(7);
  $("askT").textContent = nb(`Reprendre à la partie ${pg - 6}\u00a0?`);
  $("askP").textContent = nb(`Ton dernier tour s’est arrêté à la fin de la partie ${pg - 7}. Recommencer repart du début.`);
  $("askNo").textContent = "Recommencer"; $("askYes").textContent = "Reprendre";
  $("ask").hidden = false;
  $("askNo").onclick = () => { $("ask").hidden = true; forgetStop(src); go(7); };
  $("askYes").onclick = () => { $("ask").hidden = true; go(pg); };
}
function askThen(kind, go) {
  if (!roundStarted()) return go();
  const [t, p, yes] = ASK[kind];
  $("askT").textContent = t; $("askP").textContent = p; $("askYes").textContent = yes; $("askNo").textContent = "Continuer";
  $("ask").hidden = false;
  $("askNo").onclick = () => { $("ask").hidden = true; };
  $("askYes").onclick = () => { $("ask").hidden = true; clearTimeout(quizAuto); clearTimeout(wAuto); go(); };
}
document.querySelectorAll(".ico.home").forEach(b => { b.innerHTML = ICONS.home; b.onclick = () => askThen("quit", () => show("home")); });
$("restart").innerHTML = ICONS.restart;
// Each lesson page ends with the lesson itself: read it in the app (the book's pages) or listen to it (one link per page).
const BOOK_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 4h7a3 3 0 0 1 3 3v13a2 2 0 0 0-2-2H2z"/><path d="M22 4h-7a3 3 0 0 0-3 3v13a2 2 0 0 1 2-2h8z"/></svg>';
const EAR_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 14v-2a9 9 0 0 1 18 0v2"/><rect x="2" y="14" width="5" height="7" rx="2"/><rect x="17" y="14" width="5" height="7" rx="2"/></svg>';
const FIRST_PAGE = { 1: 6, 2: 7 };
document.querySelectorAll(".lessonbox[data-lesson]").forEach(d => {
  const n = +d.dataset.lesson, pages = LESSON_PAGES[n].map((u, i) => [u, FIRST_PAGE[n] + i]);
  d.innerHTML = `<div class="label">Leçon</div>
    <div class="lrow"><span>${BOOK_ICON}Lire</span>${n === 2 ? `<button class="lbtn" data-part="forms">Formes</button>` : ""}<button class="lbtn" data-part="book">${n === 2 ? "Lettres liées" : "Lettres"}</button>${n === 1 ? SHEETS : FICHE1}</div>
    <div class="lrow"><span>${EAR_ICON}Écouter</span>${pages.map(([u, p], i) => `<a class="lbtn" href="${u}" target="_blank" rel="noopener">${pages.length > 1 ? `Partie ${i + 1}` : "La leçon"}</a>`).join("")}</div>`;
  // Lesson 2 has two things to read: the book's pages, and the table of forms the app adds (not in the book).
  d.querySelectorAll("button").forEach(b => b.onclick = () => openPage(n, b.dataset.part));
});
// The order setting sits on each level page and drives its lesson's switch (rand1 or rand2).
function bindRand(box, lesson) {
  const src = $("rand" + lesson), input = box.querySelector("input");
  box.querySelector("b").textContent = "Cartes aléatoires";
  input.checked = src.checked; input.onchange = () => { src.checked = input.checked; };
}
bindRand(document.querySelector('.randset[data-lesson="1"]'), 1);
// Each choice screen goes from the easier way (left) to the harder one (right), with its level: one green bar, two orange
// bars, or three red bars for the hardest of all (Lier les lettres · Me tester).
function setLevel(b, n) { b.querySelector(".lvl")?.remove(); b.querySelector(".pv").insertAdjacentHTML("afterend", `<span class="lvl l${n}"><span>${[1, 2, 3].map(k => `<i class="${k <= n ? "on" : ""}"></i>`).join("")}</span>Niveau ${n}</span>`); }
document.querySelectorAll(".picks").forEach(row => row.querySelectorAll(".pick").forEach((b, i) => setLevel(b, i + 1)));
document.querySelectorAll("[data-open]").forEach(b => b.onclick = () => show("l" + b.dataset.open));
$("go1").onclick = () => show("c1");
document.addEventListener("click", e => {
  const b = e.target.closest(".pron, .spk"); if (!b) return;
  e.stopPropagation();
  if (b.classList.contains("spk")) b.classList.contains("on") ? stopSound() : playSound(b.dataset.g, b); else openPron(b.dataset.g);
}, true);
$("pronX").onclick = () => $("pron").hidden = true;
$("pron").onclick = e => { if (e.target === $("pron")) $("pron").hidden = true; };
document.querySelectorAll("[data-fam]").forEach(b => b.onclick = () => { mode = b.dataset.fam === "1" ? "fams" : "letters"; famQuiz = false; start(); });
$("goW1").onclick = () => openWriting(1);
$("goS1").onclick = () => openChoice("signs");
$("goS1").querySelector(".tile").innerHTML = signHtml(SIGNS[2], 24);   // a damma over the sheet's dotted circle
$("goW2").onclick = () => openWriting(2);
document.querySelectorAll("[data-w]").forEach(b => b.onclick = () => {

  if (b.dataset.w === "split") mode = "wwords";
  if (b.dataset.w === "form") mode = "wforms";
  if (b.dataset.w === "sign") mode = "wsigns";

});
// Tracer asks on its first card: with or without the sound of each card, the learner listens while tracing (asked like the page breaks).
let wAskSound = false;
function askSound(go) {
  $("askT").textContent = "Écouter chaque lettre\u00a0?";
  $("askP").textContent = "Le son se lance tout seul sur chaque carte, pendant que tu traces.";
  $("askNo").textContent = "Sans le son"; $("askYes").textContent = "Avec le son";
  $("ask").hidden = false;
  const set = on => { $("ask").hidden = true; wCardT0 = Date.now(); try { localStorage.setItem("autoSound", on ? "1" : "0"); } catch (e) {} if (on) loadSound(); go(); };
  $("askNo").onclick = () => set(false); $("askYes").onclick = () => set(true);
}
document.querySelectorAll(".ico.back").forEach(b => { b.innerHTML = ICONS.back; b.onclick = () => show(b.dataset.back); });
$("wRestart").innerHTML = ICONS.restart;
$("wRestart").onclick = () => askThen("restart", () => { const go = () => startWrite(wSource === LETTERS || wSource === WORD_CARDS ? null : wSource); wAskSound = wKind === "trace"; go(); });   // Tracer asks for the sound again
$("wStop").onclick = () => askThen(wKind !== "trace" ? "stop" : "quit", () => wKind !== "trace" ? showStats() : show("cw"));
$("wPeek").onclick = () => openPage(wLesson2() ? 2 : 1, mode === "wforms" ? "forms" : mode === "wsigns" ? "signs" : "book");
$("goForms").onclick = () => openChoice("forms");
$("goWords").onclick = () => openChoice("words");
$("restart").onclick = () => askThen("restart", () => start(source));
$("pBack").innerHTML = $("wTopBack").innerHTML = ICONS.back;
$("pBack").onclick = () => askThen("quit", () => show(mode === "letters" || mode === "fams" ? "c1" : mode === "words" || mode === "forms" || mode === "signs" ? "cw" : "l2"));
$("wTopBack").onclick = () => askThen("quit", () => show("cw"));
addEventListener("resize", () => { if (!$("write").hidden) wCanvas(); });
$("stop").onclick = () => askThen("stop", showStats);
$("peek").onclick = () => mode === "signs" ? openPage(1, "signs") : openPage(+$("peek").dataset.page, mode === "forms" ? "forms" : "book");
$("again").onclick = () => { wAskSound = writing() && wKind === "trace"; start(source); };
// Tracer has no right or wrong: its end says the round is done, how many cards were traced, and offers another round.
function traceEnd() {
  const l2 = mode === "wwords", k = Math.min(wPos, wDeck.length), unit = l2 ? "groupes de lettres liées" : "lettres";
  show("stats");
  $("party").className = "party m5"; $("party").innerHTML = confetti(0, 0) + MARK;
  $("rTitle").textContent = `Bravo, tu as tracé ${k === pool(mode).length ? (l2 ? "toutes les lettres liées" : "toutes les lettres") : `les ${k} ${unit}`}`;
  $("rSub").textContent = nb(`${l2 ? "Lier les lettres" : "Écrire les lettres"} · tracer · ${k} ${unit}${k > 1 ? "s" : ""}`);
  $("rTiles").hidden = $("rBar").hidden = true; $("rLine").textContent = $("missed").innerHTML = "";
  $("famText").hidden = $("reviewLabel").hidden = $("review").hidden = true;
  $("lessonLinks").innerHTML = lessonLinks(l2 ? 2 : 1);
  $("again").className = "primary";
}
$("page").onclick = closePage;

document.addEventListener("keydown", e => {
  if (e.key === "Escape") { closePage(); return; }
  if ($("play").hidden || !$("page").hidden || mode !== "letters") return;
  if (e.key === "ArrowRight") answer(true);
  else if (e.key === "ArrowLeft") answer(false);
  else if (e.key === "Backspace") undo();
  else if (e.key === " " || e.key === "Enter") { e.preventDefault(); flip(); }
});
// Start last, once everything above is set up (a reload can go straight back into a round).
if (!remembered()) show("gate"); else if (!backToPlace()) show("home");
