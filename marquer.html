<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Marquer le son</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri+Quran&display=block">
<style>
:root { --bg:#f4f3ef; --card:#fff; --ink:#1d1d1b; --muted:#6b665c; --line:#e2dccf; --accent:#1f3f8f; --ok:#2f7d4f; --miss:#c2410c; }
* { box-sizing:border-box; } [hidden] { display:none !important; }
html, body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.35 system-ui,-apple-system,sans-serif; }
.ar { font-family:"Amiri Quran", serif; direction:rtl; }
/* Everything needed while marking stays on screen: the video, the card to mark, the buttons. Only the list scrolls. */
#top { position:sticky; top:0; z-index:2; background:var(--bg); padding:max(8px, env(safe-area-inset-top)) 10px 8px; box-shadow:0 6px 12px -8px rgba(0,0,0,.25); }
.bar { display:flex; gap:6px; align-items:center; margin-bottom:6px; }
select, button { font:inherit; border-radius:999px; border:1px solid var(--line); background:var(--card); color:var(--ink); padding:6px 12px; }
select { flex:1; min-width:0; }
button.on { background:var(--ink); color:#fff; border-color:var(--ink); }
.split { display:flex; gap:8px; align-items:stretch; }
#player { flex:0 0 56%; aspect-ratio:16/9; align-self:flex-start; background:#111; border-radius:12px; overflow:hidden; }
.side { flex:1; min-width:0; display:flex; flex-direction:column; }
.side .now { flex-direction:column; margin-top:0; height:100%; }
.side .card { width:auto; flex:1; }
.side .big { flex:0 0 auto; min-height:58px; font-size:15px; }
#tune .tools { margin-top:6px; }
/* A wide screen: the video and the buttons on the left, the cards on the right, both in view. */
@media (min-width:760px) {
  body { display:grid; grid-template-columns:minmax(0, 1.1fr) minmax(0, 1fr); height:100vh; overflow:hidden; }
  #top { height:100vh; overflow:auto; box-shadow:none; }
  #list { height:100vh; overflow:auto; }
  .split { flex-direction:column; }
  #player { flex:none; width:100%; }
  .side .now { flex-direction:row; }
  .side .card { flex:none; width:120px; }
  .side .big { flex:1; min-height:80px; font-size:18px; }
}
#player iframe { width:100%; height:100%; display:block; }
.now { display:flex; gap:8px; align-items:stretch; margin-top:8px; }
.card { width:96px; flex:none; background:var(--card); border:2px solid var(--accent); border-radius:14px; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:2px; }
.card b { font-weight:400; font-size:34px; line-height:1.7; white-space:nowrap; }
.card small { font-size:11px; color:var(--muted); }
.big { flex:1; border:0; border-radius:16px; background:var(--accent); color:#fff; font-size:17px; font-weight:700; padding:8px; }
.big:disabled { opacity:.4; }
.tools { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
.tools button { padding:6px 10px; font-size:14px; }
#tune .card { border-color:var(--ink); }
#tune .tools button { flex:1 1 auto; }
#list { padding:10px; }
.hint { color:var(--muted); font-size:13px; margin:4px 0 8px; }
#cells { display:grid; grid-template-columns:repeat(auto-fill, minmax(66px, 1fr)); gap:6px; direction:rtl; }
.c { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:2px; text-align:center; }
.c b { display:block; font-weight:400; font-size:21px; line-height:1.8; white-space:nowrap; overflow:hidden; }
.c small { display:block; font-size:10px; color:var(--muted); direction:ltr; font-variant-numeric:tabular-nums; }
.c.next { border:2px solid var(--accent); background:#e8edf9; }
.c.done { border-color:var(--ok); }
.c.sel { outline:3px solid var(--ink); }
.c.fix { border-color:var(--miss); background:#fdebe1; }
#out { width:100%; height:70px; font:11px ui-monospace, monospace; border-radius:12px; border:1px solid var(--line); padding:6px; margin-top:8px; }
</style>
</head>
<body>
<div id="top">
  <div class="bar"><select id="page"></select>
    <button data-rate="1" class="on">1×</button><button data-rate="0.75">0,75×</button><button data-rate="0.5">0,5×</button></div>
  <div class="split">
  <div id="player"><div id="yt"></div></div>
  <div class="side">
  <div id="mark-mode">
    <div class="now">
      <div class="card"><b class="ar" id="nowCard"></b><small id="nowN"></small></div>
      <button class="big" id="mark">Le prof commence cette carte</button>
    </div>
  </div>
  <div id="tune" hidden>
    <div class="now">
      <div class="card"><b class="ar" id="tuneCard"></b><small id="tuneN"></small></div>
      <div style="flex:1; display:flex; flex-direction:column; gap:6px">
        <button class="big" id="play">▶ Réécouter cette carte</button>
        <button id="done">Retour au marquage</button>
      </div>
    </div>
    <div class="tools">
      <button data-nudge="-0.2">Début −0,2 s</button><button data-nudge="0.2">Début +0,2 s</button>
      <button data-nudge-end="-0.2">Fin −0,2 s</button><button data-nudge-end="0.2">Fin +0,2 s</button>
      <button id="flag">Carte mal écrite</button>
    </div>
  </div>
  </div>
  </div>
  <div class="tools" id="markTools"><button id="undo">↶ Annuler le dernier</button><button id="back">⏪ Revenir avant le dernier</button><button id="end">Fin de la dernière carte</button></div>
</div>
<div id="list">
  <p class="hint">Touche une carte déjà marquée (en vert) pour la réécouter seule et la régler. Si elle n’est pas écrite comme dans la vidéo, « Carte mal écrite » la passe en orange.</p>
  <div id="cells"></div>
  <p class="hint">Quand la page est finie et que chaque carte sonne juste : « Copier », puis colle le texte dans la conversation.</p>
  <div class="bar"><button id="copy">Copier</button><button id="clear">Effacer cette page</button></div>
  <textarea id="out" readonly></textarea>
</div>
<script src="marquer-data.js"></script>
<script>
// One page of the book at a time: the teacher's video plays, the learner taps when each card starts.
// A tap comes a little after the sound starts, so each mark is moved back by REACT seconds; each card ends where the next one starts.
const REACT = 0.25, $ = id => document.getElementById(id);
let P = null, marks = [], ends = {}, flags = [], sel = -1, yt = null, stopAt = 0, timer = 0;
const key = () => "marquer-" + P.page;
const save = () => { try { localStorage.setItem(key(), JSON.stringify({ marks, ends, flags })); } catch (e) {} };
const load = () => { try { const d = JSON.parse(localStorage.getItem(key()) || "{}"); marks = d.marks || []; ends = d.ends || {}; flags = d.flags || []; } catch (e) { marks = []; ends = {}; flags = []; } };
const clipOf = i => { const s = marks[i]; if (s == null) return null; const e = ends[i] ?? (marks[i + 1] != null ? marks[i + 1] - 0.05 : s + 1.6); return [+s.toFixed(2), +e.toFixed(2)]; };
const fmt = x => x == null ? "" : x.toFixed(1);

PAGES.forEach((p, i) => $("page").insertAdjacentHTML("beforeend", `<option value="${i}">Page ${p.page} · leçon ${p.lessons} · ${p.cells.length} cartes</option>`));
$("page").onchange = () => openPage(+$("page").value);

function openPage(i) {
  P = PAGES[i]; load(); closeTune();
  if (yt && yt.cueVideoById) yt.cueVideoById(P.video); else if (window.YT && YT.Player) makePlayer();
  draw();
}
function draw() {
  const n = marks.length, total = P.cells.length;
  $("nowCard").textContent = n < total ? P.cells[n] : "✓";
  $("nowN").textContent = n < total ? `carte ${n + 1} / ${total}` : "page finie";
  $("mark").disabled = n >= total;
  $("mark").textContent = n >= total ? "Toutes les cartes sont marquées" : "Le prof commence cette carte";
  $("cells").innerHTML = P.cells.map((c, i) => { const cl = clipOf(i);
    return `<div class="c ${i === n ? "next" : ""} ${cl ? "done" : ""} ${i === sel ? "sel" : ""} ${flags.includes(i) ? "fix" : ""}" data-i="${i}"><b class="ar">${c}</b><small>${cl ? fmt(cl[0]) + "–" + fmt(cl[1]) : i + 1}</small></div>`; }).join("");
  $("out").value = JSON.stringify({ page: P.page, video: P.video, clips: P.cells.map((_, i) => clipOf(i)), fix: flags });
  if (sel >= 0) { $("tuneCard").textContent = P.cells[sel]; const cl = clipOf(sel); $("tuneN").textContent = `carte ${sel + 1} · ${fmt(cl[0])}–${fmt(cl[1])}`; $("flag").classList.toggle("on", flags.includes(sel)); }
}

$("mark").onclick = () => { if (!yt || !yt.getCurrentTime) return; marks.push(Math.max(0, yt.getCurrentTime() - REACT * yt.getPlaybackRate())); save(); draw(); };
$("undo").onclick = () => { marks.pop(); save(); draw(); };
$("back").onclick = () => { if (yt) { yt.seekTo(marks.length ? Math.max(0, marks[marks.length - 1] - 1.5) : 0, true); yt.playVideo(); } };
$("end").onclick = () => { if (!yt || !marks.length) return; ends[marks.length - 1] = yt.getCurrentTime(); save(); draw(); };
$("clear").onclick = () => { if (confirm("Effacer tous les repères de cette page ?")) { marks = []; ends = {}; flags = []; save(); closeTune(); draw(); } };
$("copy").onclick = async () => { $("out").select(); try { await navigator.clipboard.writeText($("out").value); $("copy").textContent = "Copié ✓"; } catch (e) { document.execCommand("copy"); } setTimeout(() => $("copy").textContent = "Copier", 1500); };
document.querySelectorAll("[data-rate]").forEach(b => b.onclick = () => { document.querySelectorAll("[data-rate]").forEach(x => x.classList.toggle("on", x === b)); yt && yt.setPlaybackRate(+b.dataset.rate); });

// Tap a marked card: the top panel switches to it, to hear it alone and move its start or end, the video still in view.
$("cells").onclick = e => { const c = e.target.closest(".c"); if (!c) return; const i = +c.dataset.i; if (!clipOf(i)) return;
  sel = i; $("mark-mode").hidden = true; $("markTools").hidden = true; $("tune").hidden = false; draw(); playClip(i); };
function closeTune() { sel = -1; $("tune").hidden = true; $("mark-mode").hidden = false; $("markTools").hidden = false; }
$("done").onclick = () => { closeTune(); draw(); };
$("play").onclick = () => sel >= 0 && playClip(sel);
$("flag").onclick = () => { if (sel < 0) return; flags = flags.includes(sel) ? flags.filter(x => x !== sel) : [...flags, sel]; save(); draw(); };
document.querySelectorAll("[data-nudge]").forEach(b => b.onclick = () => { if (sel < 0) return; marks[sel] = Math.max(0, marks[sel] + +b.dataset.nudge); save(); draw(); playClip(sel); });
document.querySelectorAll("[data-nudge-end]").forEach(b => b.onclick = () => { if (sel < 0) return; const c = clipOf(sel); ends[sel] = c[1] + +b.dataset.nudgeEnd; save(); draw(); playClip(sel); });
function playClip(i) { const c = clipOf(i); if (!c || !yt || !yt.seekTo) return; yt.seekTo(c[0], true); yt.playVideo(); stopAt = c[1];
  clearInterval(timer); timer = setInterval(() => { if (yt.getCurrentTime() >= stopAt) { yt.pauseVideo(); clearInterval(timer); } }, 40); }

function makePlayer() { yt = new YT.Player("yt", { videoId: P.video, playerVars: { playsinline: 1, rel: 0, origin: location.origin } }); }
window.onYouTubeIframeAPIReady = () => { if (P) makePlayer(); };
const s = document.createElement("script"); s.src = "https://www.youtube.com/iframe_api"; document.head.appendChild(s);
openPage(0);
</script>
</body>
</html>
